<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>412 Crossy Road</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="score">0</div>

  <div id="cityLabel">PITTSBURGH</div>

  <div id="controls">↑ ↓ ← →</div>

  <div id="uiPanel">
    <label for="jerseySelect">Chicken Jersey:</label>
    <select id="jerseySelect">
      <option value="steelers">Steelers</option>
      <option value="pirates">Pirates</option>
      <option value="penguins">Penguins</option>
    </select>
  </div>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p id="finalScore">Score: 0</p>
    <p class="restart">PRESS ↑ TO PLAY AGAIN</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
