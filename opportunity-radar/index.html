<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <meta
      name="description"
      content="Find your next direction. Opportunity Radar helps college students discover fresh opportunities and make their next move."
    />
    <title>Opportunity Radar — Find your next direction</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%231a73e8'/%3E%3Ccircle cx='20' cy='20' r='13' fill='none' stroke='%23ffffff'/%3E%3Cpath d='M20 20L30 10' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script>
      if (location.hostname === "kadiekeslar.github.io") {
        localStorage.setItem(
          "radar-api",
          "https://nnzrqpvcpnhizfuxovhg.supabase.co/functions/v1/radar",
        );
      }
    </script>
    <script type="module">
      const HOSTED_API = "https://nnzrqpvcpnhizfuxovhg.supabase.co/functions/v1/radar";
      let currentProfile = {};
      const nativeFetch = window.fetch.bind(window);

      function advancedDegreeOnly(job) {
        const title = String(job?.title || "");
        const description = String(job?.description || "");
        const text = `${title}\n${description}`;
        const level = currentProfile.degree_level ||
          ((currentProfile.school || currentProfile.major || currentProfile.graduation_date) ? "Bachelor" : "");

        if (["Master", "MBA", "PhD"].includes(level)) return false;

        const titleAdvanced = /\b(ph\.?d\.?|doctoral|doctorate|mba|master(?:'s|s)?|graduate research|graduate intern)\b/i.test(title);
        const requiredAdvanced = /\b(ph\.?d\.?|doctoral|doctorate|mba|master(?:'s|s)?)\b.{0,80}\b(required|must|minimum|currently pursuing|enrolled)\b|\b(required|must|minimum|currently pursuing|enrolled)\b.{0,80}\b(ph\.?d\.?|doctoral|doctorate|mba|master(?:'s|s)?)\b/i.test(text);
        return titleAdvanced || requiredAdvanced;
      }

      function tooSenior(job) {
        const years = Number(currentProfile.years_experience ?? 0);
        if (years >= 3) return false;
        return /\b(senior|staff|principal|director|head of|vice president|vp)\b/i.test(String(job?.title || ""));
      }

      window.fetch = async (...args) => {
        const response = await nativeFetch(...args);
        const url = typeof args[0] === "string" ? args[0] : args[0]?.url || "";
        if (!response.ok) return response;

        if (url.includes("/me") || url.includes("/auth/login") || url.includes("/auth/register")) {
          try {
            const clone = response.clone();
            const data = await clone.json();
            currentProfile = data?.profile || data?.user?.profile || currentProfile;
          } catch {}
          return response;
        }

        if (url.includes("/recommendations")) {
          try {
            const data = await response.clone().json();
            if (Array.isArray(data.items)) {
              data.items = data.items.filter((job) => !advancedDegreeOnly(job) && !tooSenior(job));
              data.total = data.items.length;
              return new Response(JSON.stringify(data), {
                status: response.status,
                statusText: response.statusText,
                headers: response.headers,
              });
            }
          } catch {}
        }
        return response;
      };

      function hideUnknownEligibility(root = document) {
        for (const el of root.querySelectorAll?.("span, div, p, section") || []) {
          const text = (el.textContent || "").replace(/\s+/g, " ").trim();
          if (/^Eligibility:?\s*Unknown$/i.test(text) || /^Unknown\s*Eligibility$/i.test(text)) {
            el.style.display = "none";
          }
        }
      }
      new MutationObserver(() => hideUnknownEligibility()).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener("DOMContentLoaded", () => hideUnknownEligibility());

      document.addEventListener(
        "submit",
        async (event) => {
          const form = event.target;
          if (!(form instanceof HTMLFormElement)) return;
          const input = form.querySelector('input[name="resume"]');
          const file = input?.files?.[0];
          if (!file || !(file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf"))) return;

          event.preventDefault();
          event.stopImmediatePropagation();

          const button = form.querySelector('button[type="submit"], button:not([type])');
          const oldText = button?.textContent;
          if (button) {
            button.disabled = true;
            button.textContent = "Processing PDF…";
          }

          try {
            if (file.size > 5_000_000) throw new Error("Resume must be 5 MB or smaller.");
            const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
            pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
            const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
            if (pdf.numPages > 20) throw new Error("Resume PDFs must be 20 pages or fewer.");

            const pages = [];
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              pages.push(content.items.map((item) => item.str || "").join(" "));
            }
            const text = pages.join("\n\n").replace(/[ \t]+/g, " ").trim();
            if (text.length < 40) throw new Error("This PDF does not contain enough readable text. Scanned/image-only PDFs need OCR first.");

            const api = localStorage.getItem("radar-api") || HOSTED_API;
            const key = `radar-session:${api}`;
            const token = localStorage.getItem(key) || sessionStorage.getItem(key);
            if (!token) throw new Error("Please sign in again before uploading your resume.");

            const response = await nativeFetch(`${api}/resume`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ text }),
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.detail || "Resume upload failed.");

            alert("Resume uploaded. Your saved information and resume will now be used for job matches.");
            location.reload();
          } catch (error) {
            alert(error?.message || "Could not process this PDF.");
            if (button) {
              button.disabled = false;
              button.textContent = oldText || "Upload & find connections";
            }
          }
        },
        true,
      );
    </script>
    <script type="module" crossorigin src="/opportunity-radar/assets/index-DQHOFlsg.js"></script>
    <link rel="stylesheet" crossorigin href="/opportunity-radar/assets/index-D0RzNfMm.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
