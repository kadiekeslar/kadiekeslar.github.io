services:
  radar:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - radar-data:/app/data
      - radar-vectors:/app/chroma_store
    environment:
      AUTO_REFRESH: "1"
      REFRESH_HOURS: "4"
      CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,https://kadiekeslar.github.io"
    restart: unless-stopped
volumes:
  radar-data:
  radar-vectors:
