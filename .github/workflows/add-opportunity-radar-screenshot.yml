name: Add Opportunity Radar screenshot

on:
  push:
    paths:
      - '.github/workflows/add-opportunity-radar-screenshot.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add screenshot and update project card
        shell: bash
        run: |
          cat > /tmp/opportunity-radar-project.b64 <<'EOF'

EOF
          base64 -d /tmp/opportunity-radar-project.b64 > opportunity-radar-project.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="project-image"><div class="project-image-fallback" style="display:grid;background:#e8f0fe;color:#1967d2;font-size:32px;letter-spacing:-1px;">Opportunity Radar</div></div>'
          new = '<div class="project-image"><img src="opportunity-radar-project.jpg" alt="Opportunity Radar job discovery website" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'grid\';"><div class="project-image-fallback">Opportunity Radar</div></div>'
          if old not in s:
              raise SystemExit('Opportunity Radar placeholder was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html opportunity-radar-project.jpg
          git commit -m "Add Opportunity Radar portfolio screenshot"
          git push
